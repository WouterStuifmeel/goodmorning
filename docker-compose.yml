services:
  goodmorning:
    image: goodmorning:latest
    ports:
      - "9292:8000"
    environment:
      GOODMORNING_PRESENTER_VOICE: cedar
      GOODMORNING_SCRIPT_PROVIDER: mock
      GOODMORNING_TTS_PROVIDER: mock
      GOODMORNING_NEWS_PROVIDER: mock
    env_file:
      - path: /volume1/docker/goodmorning/.env
        required: false
    volumes:
      - jobs-data:/data
      - /volume1/docker/goodmorning/output:/media/goodmorning

volumes:
  jobs-data: