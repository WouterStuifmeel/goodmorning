- id: '1765305901930'
  alias: Hue Dial Controls
  description: ''
  use_blueprint:
    path: fleeman/zigbee2mqtt-philips-hue-tap-dial-switch-by-smarthomegeeks-io.yaml
    input:
      mqtt_topic: zigbee2mqtt/Hue Dial
      tap_counter: counter.hue_dial_counter
      last_pressed: input_text.hue_dial_last_pressed_input
      button_1_single_press:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_pct: 75
        target:
          entity_id:
          - light.plafondlamp
          - light.plafondlamp_2
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - light.ikea_tradfri_living_room_lights
          - light.inbouw_spots
      button_1_double_press:
