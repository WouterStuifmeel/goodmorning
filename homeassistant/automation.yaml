- id: '1766177535608'
  alias: Notify TV of dish washer program finish
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.bosch_dishwasher_operation_state
    to:
    - Finished
  conditions: []
  actions:
  - action: notify.google_tv
    metadata: {}
    data:
      title: Bosch Dish Washer
      message: Program finished
      data:
        duration: 5
        position: top-right
        fontsize: medium
        transparency: 75%
        color: teal
        interrupt: 0
  mode: single
- id: '1766255061066'
  alias: Washer Monitor
  description: ''
  use_blueprint:
    path: leofabri/appliance-status-monitor.yaml
    input:
      appliance_socket: switch.0xa4c13807383bffff
      appliance_power_sensor: sensor.0xa4c13807383bffff_power
      appliance_finishing_power_threshold: 2
      appliance_job_cycle: input_boolean.washing_machine_job_cycle
      delayed_job_completion_timer: timer.washing_machine_delayed_job_completion_timer
      automation_self_trigger: input_boolean.washing_machine_automation_self_trigger
      delayed_job_completion_duration: 15
      appliance_state_machine: input_select.washing_machine_state_machine
      appliance_starting_power_threshold: 10
      actions_job_cycle_ends:
      - action: notify.mobile_app_iphone_van_wouter
        metadata: {}
        data:
          title: Bosch Washing Machine
          message: Program finished
      - action: notify.google_tv
        metadata: {}
        data:
          message: Program finished
          data:
            duration: 5
            position: top-right
            fontsize: medium
            transparency: 75%
            color: teal
            interrupt: 0
          title: Bosch Washing Machine
- id: '1766255061080'
  alias: Good Morning - generate episode
  description: Pulls today's weather and starts podcast generation
  trigger:
    - platform: time
      at: "05:45:00"
  condition: []
  action:
    - action: weather.get_forecasts
      target:
        entity_id: weather.home
      data:
        type: daily
      response_variable: forecast_response
  
    - variables:
        today_forecast: "{{ forecast_response['weather.home'].forecast[0] }}"
        payload: >-
          {{
            {
              "source_facts": {
                "episode_date": now().strftime("%Y-%m-%d"),
                "location": "Utrecht, Netherlands",
                "weather": {
                  "summary": (today_forecast.condition | replace('-', ' ') ~ ", highs near "
                              ~ today_forecast.temperature | round(0) | string ~ "°C") ,
                  "high_c": today_forecast.temperature,
                  "low_c": today_forecast.templow,
                  "conditions": today_forecast.condition,
                  "precipitation_chance": today_forecast.precipitation_probability,
                  "wind_kph": today_forecast.wind_speed
                },
                "calendar_events": [],
                "reminders": [],
                "interests": ["technology", "world"]
              }
            } | to_json
          }}
  
    - action: rest_command.goodmorning_generate_episode
      data:
        payload: "{{ payload }}"